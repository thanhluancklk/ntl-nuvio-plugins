name: Auto Sync & Build Clean Plugins

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone upstream Nuvio repo (Clean Source)
        run: |
          git clone --depth 1 https://github.com/NuvioPlugin/All-in-One-Nuvio.git upstream_repo
          rm -rf src
          cp -r upstream_repo/src ./src
          rm -rf upstream_repo

      - name: Install dependencies
        run: npm install

      - name: Inject Smart Filter
        run: node modifier.js

      - name: Bundle Clean Code (No Obfuscation)
        run: node build.js

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add providers/*.js src/ package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-sync, inject filter, and build clean code"
            git push
          fi
